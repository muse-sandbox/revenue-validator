# FLOW-577 — Inventory исторических revenue-экспериментов, размеченных по модели
# релевантности FLOW-574 (блоки A/B/C) и словарю flow_stage из FLOW-576 (S0–S9).
#
# corpus_type — стратегия отбора относительно якоря (семейство Interstitials, FLOW-568):
#   type1 = та же поверхность и механизм (interstitial-слой UG App)
#   type2 = тот же этап user flow — exposure монетизационной поверхности (ядро S3–S4;
#           граничные кейсы: T2-05 — триггер на S8, показ на S3; T2-07 — S1–S3
#           feature-gate), но другая поверхность
#   type3 = та же денежная метрика (ARPU / trial→charge / access CR), другой flow или механизм
#
# source_confidence:
#   verified-card      — факты сверены с первоисточником: карточки FLOW-568/571 (KS-*/GT-IH-*)
#                        либо прямая сверка со снапшотом Confluence-страницы (2026-08-04,
#                        snapshots в output/confluence/flow577_verify/). С 2026-08-04 ВСЕ
#                        24 кейса — verified-card: 14 mirror-кейсов типов 2–3 сверены со
#                        страницами (2 CONFIRMED, 12 CORRECTED; см. историю в Linear FLOW-577).
#   mirror-annotation  — (исторический статус V1 файла) данные из локального зеркала базы
#                        гипотез (context/hypotheses/) без сверки со страницей.
#
# validity.result_class: significant-positive | significant-negative | powered-null |
#                        inconclusive | mixed
#   `mixed` — расширение словаря FLOW-574 (в модели V0 его нет): разные исходы по
#   платформам/рукам, расшифровка в ci/notes. Предлагаемое правило гейтирования для
#   модели V0.1: hard filter §4.6 применяется к той платформе/руке, чей вывод
#   переносится (например, And-ветка T1-04 — significant-positive, iOS-ветка — нет).
# ВАЖНО (гейт §4.6): для source_confidence: mirror-annotation значение result_class —
#   ПРЕДВАРИТЕЛЬНОЕ. После сверки 2026-08-04 таких кейсов в корпусе НЕ осталось;
#   все result_class подтверждены p-values со страниц (поле ci хранит извлечённые значения).
# Поля с "не проверено" / "не документировано" — честные пробелы, не пропуски разметки.

meta:
  version: 2   # V0.1: все 24 кейса сверены с Confluence-страницами (2026-08-04)
  date: 2026-08-04
  task: FLOW-577
  relevance_model: FLOW-574 (комментарий в Linear, V0)
  flow_map: FLOW-576 (Revenue User Flow V0, S0–S9)
  anchor:
    description: >
      Якорь для типологии — семейство «UG App monetization interstitials»
      (каноническая DOCS-страница 777830942): собственный offer-слой App,
      показываемый вместо рекламной паузы в табах; flow_stage S3–S4; сегменты
      free / ex-paid; механизмы — содержимое/оффер/частота слоя.
  units: денежные величины — net revenue, если в источнике не оговорено иное
  excluded:
    - id: "761947509"
      title: "Explore product widget instead of sale banner (7085/7130/7229)"
      reason: >
        Исход не восстанавливается из зеркала базы гипотез (аннотация без
        результата и решения); включать без сверки со страницей нельзя.

experiments:

  # ======================== TYPE 1 — та же поверхность и механизм ========================

  - key: T1-01
    corpus_type: type1
    title: "UG iOS: Interstitial – Swap into Landing"
    A:
      exp_ids: ["4845"]
      page: "https://alice.mu.se/pages/viewpage.action?pageId=459868984"
      jira: UMN-5306
      dates: "2024-04-24..2024-08-10 (run 2024-07-15..2024-07-20)"
      iteration_of: null   # первый эксперимент линии "replace ad interstitials"
      validity:
        srm_ok: "да (3 283 / 3 250)"
        maturity_ok: "не документировано"
        result_class: inconclusive
        ci: "все монетизационные diffs незначимы (ARPU −10.5%, p=0.67); охват микроскопический"
      plan_fact:
        plan: "+10% Interstitial→Access и ARPU iOS (~+$666/день по модели)"
        fact: "≈0: 4 access из нового источника за весь эксперимент; forecast −$19/день"
      decision: killed
    B:
      flow_stage: "S3–S4"
      segment: "free (без подписки и триала), iOS, весь трафик"
      trigger_eligibility: "no-fill исход рекламного аукциона на входе в таб; лендинг 1 раз/день; слот: ≤5 показов/день, гэп 180с"
      surface: "interstitial slot (скролл-лендинг вместо HL-рекламы)"
      mechanism: "new-surface (замена рекламы продажным лендингом)"
      offer: "стандартная Pro-подписка (без спец. SKU)"
      behavior: "показ преимуществ подписки вместо пустого no-fill → больше trial starts"
      metric: "Interstitial → Access % (primary); ARPU"
      money_chain: "exposure → paywall → trial → charge; D0–D14; net"
      guardrails: "retention 1/7d"
    C:
      outcome: "Ничего не изменилось: слишком малый охват (только no-fill, 1/день); 6% доступов интерстишл-когорты из нового источника."
      lesson: "Reach — связывающее ограничение: заполнение только no-fill-остатков не двигает ни одну метрику; идея «замещать показы активно» стала основой следующих проектов."
      transfer_bounds: "Только конфигурация «пассивное заполнение no-fill 1/день, iOS 2024»; не говорит о потенциале слоя при активном замещении."
      fact_vs_interpretation: "Факт: нулевой охват и незначимые diffs. Интерпретация автора: формат лендинга переиспользуем в будущих пейволлах."
    source_confidence: verified-card
    source: "KS-01 (FLOW-568 knowledge-sources)"

