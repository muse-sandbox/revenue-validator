      lesson: "Ex-subscribers — сильнейшие респондеры (до 13× CR) — это открытие породило winback-линию; первый показ делает 60–87% работы; щедрый триал тянет низкокачественные триалы."
      transfer_bounds: "Free-аудитория App; вывод о ex-sub — только как направление (найден через баг сегментации); величины не переносятся."
      fact_vs_interpretation: "Факты: значимые лифты и каннибализация измерены. Интерпретация: «novelty trap» как причина отказа от роллаута — суждение команды, не измерено."
