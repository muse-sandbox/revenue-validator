experiments:
- key: T1-01
  corpus_type: type1
  title: 'UG iOS: Interstitial – Swap into Landing'
  A:
    exp_ids:
    - '4845'
    page: https://alice.mu.se/pages/viewpage.action?pageId=459868984
    jira: UMN-5306
    dates: 2024-04-24..2024-08-10 (run 2024-07-15..2024-07-20)
    iteration_of: null
    validity:
      srm_ok: да (3 283 / 3 250)
      maturity_ok: не документировано
      result_class: inconclusive
      ci: все монетизационные diffs незначимы (ARPU −10.5%, p=0.67); охват микроскопический
    plan_fact:
      plan: +10% Interstitial→Access и ARPU iOS (~+$666/день по модели)
      fact: '≈0: 4 access из нового источника за весь эксперимент; forecast −$19/день'
    decision: killed
  B:
    flow_stage: S3–S4
    segment: free (без подписки и триала), iOS, весь трафик
    trigger_eligibility: 'no-fill исход рекламного аукциона на входе в таб; лендинг 1 раз/день; слот:
      ≤5 показов/день, гэп 180с'
    surface: interstitial slot (скролл-лендинг вместо HL-рекламы)
    mechanism: new-surface (замена рекламы продажным лендингом)
    offer: стандартная Pro-подписка (без спец. SKU)
    behavior: показ преимуществ подписки вместо пустого no-fill → больше trial starts
    metric: Interstitial → Access % (primary); ARPU
    money_chain: exposure → paywall → trial → charge; D0–D14; net
    guardrails: retention 1/7d
  C:
    outcome: 'Ничего не изменилось: слишком малый охват (только no-fill, 1/день); 6% доступов интерстишл-когорты
      из нового источника.'
    lesson: 'Reach — связывающее ограничение: заполнение только no-fill-остатков не двигает ни одну метрику;
      идея «замещать показы активно» стала основой следующих проектов.'
    transfer_bounds: Только конфигурация «пассивное заполнение no-fill 1/день, iOS 2024»; не говорит о
      потенциале слоя при активном замещении.
    fact_vs_interpretation: 'Факт: нулевой охват и незначимые diffs. Интерпретация автора: формат лендинга
      переиспользуем в будущих пейволлах.'
  source_confidence: verified-card
  source: KS-01 (FLOW-568 knowledge-sources)
- key: T1-02
  corpus_type: type1
  title: 'UG App: paywall – offer instead of ad interstitials (iter 1–2)'
