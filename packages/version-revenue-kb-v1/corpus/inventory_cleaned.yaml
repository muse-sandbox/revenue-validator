    validity:
      srm_ok: 'да (iter2: 260 468 / 259 687 iOS; 156 391 / 157 021 And)'
      maturity_ok: trial→charge читаемо; отдельного pending-гейта на странице нет
      result_class: mixed
      ci: iOS iter2 ARPU +7.5% (p=0.029); And +4.94% (p=0.36)
    plan_fact:
      plan: +71% revenue по модели (iOS)
      fact: iter1 +24%/+13% ARPU — артефакт (ex-premium в сегменте, ~37% выручки); iter2 после чистки
        +7.5%/+5%; каннибализация 34% iOS / 63% And
    decision: killed
  B:
    flow_stage: S3–S4
    segment: 'free (iter1 с багом: + ex-premium; iter2: ex-premium исключены), iOS+Android'
    trigger_eligibility: ad-fail/zero-state на табе, поиске, версиях; слот-капы 5/день, 180с
    surface: interstitial slot + ad-banner места (tab/search/versions)
    mechanism: new-surface + offer-structure (Pro+ $39.99/год с 14-дневным триалом вместо рекламы)
    offer: Pro+ 1y $39.99, extended 14d trial (ugt.plus.1year7 / tabs.plus.1year5)
    behavior: продажный экран вместо нулевой рекламы → больше trial starts
    metric: Interstitial → Access % (primary); ARPU
    money_chain: exposure → paywall → trial → charge; D0–D14; net
    guardrails: retention 1/7d, 14d cancel, каннибализация прочих источников
  C:
    outcome: ARPU-рост реален, но 2–3× меньше после чистки сегмента; сильная каннибализация; trial→charge
      интерстишлов ниже среднего (−13% iOS / −45% And).
    lesson: Ex-subscribers — сильнейшие респондеры (до 13× CR) — это открытие породило winback-линию;
      первый показ делает 60–87% работы; щедрый триал тянет низкокачественные триалы.
    transfer_bounds: Free-аудитория App; вывод о ex-sub — только как направление (найден через баг сегментации);
      величины не переносятся.
    fact_vs_interpretation: 'Факты: значимые лифты и каннибализация измерены. Интерпретация: «novelty
      trap» как причина отказа от роллаута — суждение команды, не измерено.'
