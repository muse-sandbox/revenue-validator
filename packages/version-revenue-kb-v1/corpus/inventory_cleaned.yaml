      ci: iOS Winbacks ARPU +241% (p=0.000), buyers +365.6%; Total ARPU +9.3% (p=0.40)
    plan_fact:
      plan: формального дизайна нет (design values = 0)
      fact: сегментная победа подтверждена; Total-лифт потерял значимость после дозревания контрольных
        триалов; forecast +$151/день iOS, +$107/день And
    decision: rolled-out
  B:
    flow_stage: S3–S4 (после исчерпания winback-окна)
    segment: ex-paid, исчерпавшие winback-окно; iOS+Android (v7.3.9+)
    trigger_eligibility: 1 раз, только после просмотра winback-интерстишла и не раньше следующего дня
    surface: interstitial slot (финальный «последний шанс» оффер)
    mechanism: offer-structure + price (deep-discount instant $19.99 вместо триала)
    offer: Pro+ instant $19.99 (промокод)
    behavior: глубокая скидка на мёртвом сегменте → немедленная оплата вместо триала
    metric: members → buyers %; ARPU (winback-сегмент)
    money_chain: exposure → instant charge (без trial-звена); D0; net
    guardrails: retention (flat), full-price dilution (iOS −$702 non-winback), churn/refund 14d
  C:
    outcome: '«Оживляет мёртвый сегмент»: нулевая конверсия исчерпанного winback превращается в значимые
      покупки; выигрыш на оплате, не на подписках (final = 100% instant).'
    lesson: Deep-discount instant меняет trials на немедленный платёж (EV-положительно на high-intent
      сегменте); sequencing защищает стандартный winback структурно; зрелость меняет выводы — Total-лифт
      исчез после дозревания контроля.
    transfer_bounds: Только ex-paid high-intent; на free перенос запрещён; iOS diffuse dilution ограничивает
